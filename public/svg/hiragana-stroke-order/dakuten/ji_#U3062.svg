<style>
.grid { stroke: #e0e0e0; stroke-width: 0.5; }
.stroke {
  fill: none;
  stroke: #1a1a2e;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  animation-name: draw;
  animation-timing-function: ease-in-out;
  animation-fill-mode: forwards;
}
