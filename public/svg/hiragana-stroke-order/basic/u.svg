<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 109 109" width="320" height="320">
<style>
.grid { stroke: #e0e0e0; stroke-width: 0.5; }
.stroke {
  fill: none;
  stroke: #1a1a2e;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  animation-name: draw;
  animation-timing-function: ease-in-out;
  animation-fill-mode: forwards;
}
@keyframes draw { to { stroke-dashoffset: 0; } }
.arrow {
  opacity: 0;
  animation-name: showArrow;
  animation-duration: 0.01s;
  animation-fill-mode: forwards;
}
@keyframes showArrow { to { opacity: 1; } }
.num {
  font-family: Arial, sans-serif;
  font-size: 9px;
  fill: #1d7bd8;
  font-weight: bold;
  opacity: 0;
  animation-name: showNum;
  animation-duration: 0.01s;
  animation-fill-mode: forwards;
}
@keyframes showNum { to { opacity: 1; } }
</style>
<rect x="0" y="0" width="109" height="109" fill="#ffffff" stroke="#f0f0f0"/>
<line x1="54.5" y1="0" x2="54.5" y2="109" class="grid"/>
<line x1="0" y1="54.5" x2="109" y2="54.5" class="grid"/>
<g>
<path d="M42,15.5c5.62,2.12,9.62,3,12.88,3c8.27,0,8,1.12-0.38,5.5" class="stroke" style="stroke-dasharray:27.6;stroke-dashoffset:27.6;animation-duration:0.35s;animation-delay:0.00s"/><path d="M33,42.38c2.12,1.12,4.12,2.88,8.5,1.38c4.38-1.5,12.75-7.12,18.5-7c5.75,0.12,10.25,5,10.25,18c0,15.49-8.25,30.24-24.37,41.24" class="stroke" style="stroke-dasharray:101.9;stroke-dashoffset:101.9;animation-duration:1.10s;animation-delay:0.35s"/>
<g class="arrow" style="animation-delay:0.30s" transform="translate(54.5,24.0) rotate(151.0)"><path d="M0,0 L-6,-3 L-6,3 Z" fill="#e63946"/></g><g class="arrow" style="animation-delay:1.40s" transform="translate(45.9,96.0) rotate(141.1)"><path d="M0,0 L-6,-3 L-6,3 Z" fill="#e63946"/></g>
<text x="33.5" y="14.1" class="num" style="animation-delay:0.00s">1</text><text x="28.8" y="39.6" class="num" style="animation-delay:0.35s">2</text>
