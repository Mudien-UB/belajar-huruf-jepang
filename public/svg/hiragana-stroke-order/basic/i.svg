<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 109 109" width="320" height="320">
<style>
.grid { stroke: #e0e0e0; stroke-width: 0.5; }
.stroke {
  fill: none;
  stroke: #1a1a2e;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  animation-name: draw;
  animation-timing-function: ease-in-out;
  animation-fill-mode: forwards;
}
@keyframes draw { to { stroke-dashoffset: 0; } }
.arrow {
  opacity: 0;
  animation-name: showArrow;
  animation-duration: 0.01s;
  animation-fill-mode: forwards;
}
@keyframes showArrow { to { opacity: 1; } }
.num {
  font-family: Arial, sans-serif;
  font-size: 9px;
  fill: #1d7bd8;
  font-weight: bold;
  opacity: 0;
  animation-name: showNum;
  animation-duration: 0.01s;
  animation-fill-mode: forwards;
}
@keyframes showNum { to { opacity: 1; } }
</style>
<rect x="0" y="0" width="109" height="109" fill="#ffffff" stroke="#f0f0f0"/>
<line x1="54.5" y1="0" x2="54.5" y2="109" class="grid"/>
<line x1="0" y1="54.5" x2="109" y2="54.5" class="grid"/>
<g>
<path d="M21.5,29.66c2.01,2.17,2.61,4.68,2.17,7.43c-3.09,19.16-1.03,32.01,7.93,41.45c6.12,6.45,6.26,3.14,7.04-5.21" class="stroke" style="stroke-dasharray:67.1;stroke-dashoffset:67.1;animation-duration:0.75s;animation-delay:0.00s"/><path d="M72.96,36.51c9.44,8.05,17.79,18.82,18.41,33.83" class="stroke" style="stroke-dasharray:39.7;stroke-dashoffset:39.7;animation-duration:0.44s;animation-delay:0.75s"/>
<g class="arrow" style="animation-delay:0.70s" transform="translate(38.6,73.3) rotate(-81.0)"><path d="M0,0 L-6,-3 L-6,3 Z" fill="#e63946"/></g><g class="arrow" style="animation-delay:1.14s" transform="translate(91.4,70.3) rotate(84.6)"><path d="M0,0 L-6,-3 L-6,3 Z" fill="#e63946"/></g>
<text x="15.0" y="27.1" class="num" style="animation-delay:0.00s">1</text><text x="62.2" y="32.9" class="num" style="animation-delay:0.75s">2</text>
