<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 109 109" width="320" height="320">
<style>
.grid { stroke: #e0e0e0; stroke-width: 0.5; }
.stroke {
  fill: none;
  stroke: #1a1a2e;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  animation-name: draw;
  animation-timing-function: ease-in-out;
  animation-fill-mode: forwards;
}
@keyframes draw { to { stroke-dashoffset: 0; } }
.arrow {
  opacity: 0;
  animation-name: showArrow;
  animation-duration: 0.01s;
  animation-fill-mode: forwards;
}
@keyframes showArrow { to { opacity: 1; } }
.num {
  font-family: Arial, sans-serif;
  font-size: 9px;
  fill: #1d7bd8;
  font-weight: bold;
  opacity: 0;
  animation-name: showNum;
  animation-duration: 0.01s;
  animation-fill-mode: forwards;
}
@keyframes showNum { to { opacity: 1; } }
</style>
<rect x="0" y="0" width="109" height="109" fill="#ffffff" stroke="#f0f0f0"/>
<line x1="54.5" y1="0" x2="54.5" y2="109" class="grid"/>
<line x1="0" y1="54.5" x2="109" y2="54.5" class="grid"/>
<g>
<path d="M15,48.75c2.25,1.62,4.67,1.96,7-0.38c3.62-3.62,7.46-6.54,11.25-10.5c5.5-5.75,8.48-4.75,13.12-0.88c12.12,10.12,30.38,25.12,33.38,27.38c3,2.26,12.37,10.38,13.87,11.63" class="stroke" style="stroke-dasharray:99.8;stroke-dashoffset:99.8;animation-duration:1.10s;animation-delay:0.00s"/>
<g class="arrow" style="animation-delay:1.05s" transform="translate(93.6,76.0) rotate(40.4)"><path d="M0,0 L-6,-3 L-6,3 Z" fill="#e63946"/></g>
<text x="9.9" y="42.8" class="num" style="animation-delay:0.00s">1</text>
</g>
</svg>