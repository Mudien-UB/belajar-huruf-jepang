<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 109 109" width="320" height="320">
<style>
.grid { stroke: #e0e0e0; stroke-width: 0.5; }
.stroke {
  fill: none;
  stroke: #1a1a2e;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  animation-name: draw;
  animation-timing-function: ease-in-out;
  animation-fill-mode: forwards;
}
@keyframes draw { to { stroke-dashoffset: 0; } }
.arrow {
  opacity: 0;
  animation-name: showArrow;
  animation-duration: 0.01s;
  animation-fill-mode: forwards;
}
@keyframes showArrow { to { opacity: 1; } }
.num {
  font-family: Arial, sans-serif;
  font-size: 9px;
  fill: #1d7bd8;
  font-weight: bold;
  opacity: 0;
  animation-name: showNum;
  animation-duration: 0.01s;
  animation-fill-mode: forwards;
}
@keyframes showNum { to { opacity: 1; } }
</style>
<rect x="0" y="0" width="109" height="109" fill="#ffffff" stroke="#f0f0f0"/>
<line x1="54.5" y1="0" x2="54.5" y2="109" class="grid"/>
<line x1="0" y1="54.5" x2="109" y2="54.5" class="grid"/>
<g>
<path d="M53.82,28.62c1,1.5,1.34,4.12,0.88,6.62c-1.75,9.5-6.89,25-10.75,33.12c-9.63,20.26-16.55,14.74-24.38-1.98c-9.13-19.5,23.5-48.88,50.63-40.38c32.38,10.15,28,54.62-4.75,60.88" class="stroke" style="stroke-dasharray:242.0;stroke-dashoffset:242.0;animation-duration:1.10s;animation-delay:0.00s"/>
<g class="arrow" style="animation-delay:1.05s" transform="translate(65.5,86.9) rotate(148.1)"><path d="M0,0 L-6,-3 L-6,3 Z" fill="#e63946"/></g>
<text x="46.5" y="34.9" class="num" style="animation-delay:0.00s">1</text>
</g>
</svg>