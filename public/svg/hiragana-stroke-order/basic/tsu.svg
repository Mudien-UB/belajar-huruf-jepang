<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 109 109" width="320" height="320">
<style>
.grid { stroke: #e0e0e0; stroke-width: 0.5; }
.stroke {
  fill: none;
  stroke: #1a1a2e;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  animation-name: draw;
  animation-timing-function: ease-in-out;
  animation-fill-mode: forwards;
}
@keyframes draw { to { stroke-dashoffset: 0; } }
.arrow {
  opacity: 0;
  animation-name: showArrow;
  animation-duration: 0.01s;
  animation-fill-mode: forwards;
}
@keyframes showArrow { to { opacity: 1; } }
.num {
  font-family: Arial, sans-serif;
  font-size: 9px;
  fill: #1d7bd8;
  font-weight: bold;
  opacity: 0;
  animation-name: showNum;
  animation-duration: 0.01s;
  animation-fill-mode: forwards;
}
@keyframes showNum { to { opacity: 1; } }
</style>
<rect x="0" y="0" width="109" height="109" fill="#ffffff" stroke="#f0f0f0"/>
<line x1="54.5" y1="0" x2="54.5" y2="109" class="grid"/>
<line x1="0" y1="54.5" x2="109" y2="54.5" class="grid"/>
<g>
<path d="M14,44.75c1.88,1.62,4.68,2.09,8.12,0.62c17.88-7.62,30-11.12,44.88-10.88c12.56,0.21,22.98,7.17,22.87,19.17c-0.18,18.77-24.75,28.71-45.01,32.08" class="stroke" style="stroke-dasharray:148.2;stroke-dashoffset:148.2;animation-duration:1.10s;animation-delay:0.00s"/>
<g class="arrow" style="animation-delay:1.05s" transform="translate(44.9,85.7) rotate(166.3)"><path d="M0,0 L-6,-3 L-6,3 Z" fill="#e63946"/></g>
<text x="9.8" y="40.4" class="num" style="animation-delay:0.00s">1</text>
</g>
</svg>